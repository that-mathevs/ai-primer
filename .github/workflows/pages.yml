# The lessons are read at rumblr.com, built from this repository. GitHub Pages
# serves one redirect per page the old site had, so old links still land.
# Run the tests, then publish the redirects on every push to main.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,docs]" matplotlib
      - run: make test
      - run: make redirects
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
